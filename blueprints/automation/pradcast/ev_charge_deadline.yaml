blueprint:
  name: "Pradcast: ładowanie auta w najtańszych godzinach do wyjazdu"
  description: >
    Co godzinę przelicza N najtańszych godzin (interruptible=true) między teraz
    a godziną wyjazdu i włącza ładowarkę tylko w tych godzinach. Re-planuje co
    godzinę - odporne na restart HA i aktualizacje prognozy.

    UWAGA: blueprint zakłada, że ładowarka/auto same zatrzymają ładowanie po
    osiągnięciu docelowego SoC. "Godziny ładowania" to budżet czasu, nie licznik
    energii - przy stabilnej prognozie auto ładuje się dokładnie w najtańszych
    godzinach. Wymaga pakietu packages/pradcast.yaml.
  domain: automation
  source_url: https://pradcast.pl/blueprints/automation/pradcast/ev_charge_deadline.yaml
  input:
    charger_switch:
      name: Przełącznik ładowarki
      description: >
        Encja przełącznika (switch) lub input_boolean sterująca ładowaniem
        albo gniazdkiem ładowarki.
      selector:
        entity:
          domain:
            - switch
            - input_boolean
    departure_time:
      name: Godzina wyjazdu
      description: >
        Termin gotowości pojazdu. Ładowanie planowane jest w najtańszych
        godzinach do najbliższego przyszłego wystąpienia tej pory.
      default: "07:00:00"
      selector:
        time: {}
    charge_hours:
      name: Liczba godzin ładowania
      description: >
        Budżet czasu ładowania w godzinach. Automatyzacja co godzinę wybiera
        tyle najtańszych godzin do wyjazdu. Zakłada, że ładowarka lub pojazd
        zakończą ładowanie po osiągnięciu docelowego poziomu naładowania.
      default: 4
      selector:
        number:
          min: 1
          max: 24
          step: 1
          unit_of_measurement: h
          mode: slider
    enable_entity:
      name: Włącznik harmonogramu (opcjonalne)
      description: >
        Encja input_boolean, która musi być włączona, aby harmonogram
        ładowania działał. Pozostaw puste, aby był zawsze aktywny.
      default: []
      selector:
        entity:
          domain:
            - input_boolean

mode: single
max_exceeded: silent

variables:
  charge_hours: !input charge_hours
  departure_time: !input departure_time
  enable_entity: !input enable_entity

trigger:
  - platform: time_pattern
    minutes: "1"

condition:
  - condition: template
    value_template: >
      {{ enable_entity in [none, '', []] or is_state(enable_entity, 'on') }}

action:
  - variables:
      by_str: >
        {% set t = today_at(departure_time) %}
        {% set by = t if t > now() else t + timedelta(days=1) %}
        {{ by.strftime('%Y-%m-%dT%H:%M:%S') }}
  - service: rest_command.pradcast_best_window
    data:
      duration: "{{ charge_hours }}"
      by: "{{ by_str }}"
      interruptible: "true"
    response_variable: resp
  - variables:
      now_key: "{{ now().strftime('%Y-%m-%dT%H') }}"
      on_keys: >
        {{ (resp.content.hours if resp.status == 200 else [])
           | map(attribute='datetime')
           | map('regex_replace', ':.*$', '')
           | list }}
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ now_key in on_keys }}"
        sequence:
          - service: homeassistant.turn_on
            target:
              entity_id: !input charger_switch
    default:
      - service: homeassistant.turn_off
        target:
          entity_id: !input charger_switch
